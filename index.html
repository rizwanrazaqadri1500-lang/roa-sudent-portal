<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raza Online Islamic Academy - Admin & Student Management</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#047857">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased text-slate-800">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-700 p-2 rounded-lg border border-emerald-600">
                    <i class="fa-solid fa-shield-halved text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">Raza Online Islamic Academy</h1>
                    <span class="text-xs text-slate-400 font-medium">Admin & Student Management Portal</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="bg-emerald-900/80 text-emerald-300 text-xs px-3 py-1.5 rounded-full border border-emerald-700 font-medium flex items-center">
                    <i class="fa-solid fa-circle text-[8px] text-emerald-400 mr-1.5 animate-pulse"></i> System Active
                </span>
                <button onclick="switchView()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3.5 py-1.5 rounded-lg border border-slate-700 transition font-medium">
                    Switch to Parent View
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
            <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-100">
                <div class="w-10 h-10 bg-emerald-50 text-emerald-700 rounded-xl flex items-center justify-center font-bold">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Edit Student Profile: Muhammad</h2>
                    <p class="text-xs text-slate-500">Update student information and login credentials</p>
                </div>
            </div>

            <form onsubmit="handleUpdateProfile(event)" class="space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Student Name -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Student Name *</label>
                        <input type="text" id="student-name" value="Muhammad" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition">
                    </div>

                    <!-- Father's Name -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Father's Name *</label>
                        <input type="text" id="father-name" value="Ali" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition">
                    </div>

                    <!-- Student ID Field -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Student ID (Portal Login) *</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i class="fa-solid fa-id-card"></i>
                            </span>
                            <input type="text" id="custom-student-id" value="ROA-2026-0001" required class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition uppercase font-semibold text-emerald-800" placeholder="ROA-2026-0001">
                        </div>
                    </div>

                    <!-- Select Course (Nazrah Quran Pak Added) -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Select Course</label>
                        <select id="student-course" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition">
                            <option selected>Nazrah Quran Pak</option>
                            <option>Madani Qaida</option>
                            <option>Hifz-e-Quran</option>
                            <option>Tajweed & Qirat Masterclass</option>
                            <option>Dars-e-Nizami Core Studies</option>
                        </select>
                    </div>

                    <!-- Age -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Age *</label>
                        <input type="number" id="student-age" value="7" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition">
                    </div>

                    <!-- Parent Mobile -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Parent Mobile / WhatsApp</label>
                        <input type="text" id="parent-mobile" value="+61 431 027 336" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition">
                    </div>

                    <!-- Country & Currency -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Select Country & Currency *</label>
                        <select id="student-country" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-600 focus:bg-white text-sm outline-none transition">
                            <option selected>AU Australia (AUD)</option>
                            <option>PK Pakistan (PKR)</option>
                            <option>US United States (USD)</option>
                            <option>GB United Kingdom (GBP)</option>
                        </select>
                    </div>
                </div>

                <!-- Student Photo Upload -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Student Photo (Upload / Image)</label>
                    <input type="file" id="student-photo" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 transition">
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center justify-end space-x-4 pt-4 border-t border-slate-100">
                    <button type="button" onclick="cancelEdit()" class="px-6 py-2.5 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-medium transition">
                        Cancel Edit
                    </button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-medium transition shadow-lg shadow-emerald-700/25">
                        Update Student Profile
                    </button>
                </div>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Raza Online Islamic Academy. All rights reserved.
    </footer>

    <!-- Script -->
    <script>
        function handleUpdateProfile(e) {
            e.preventDefault();
            const studentId = document.getElementById('custom-student-id').value;
            const course = document.getElementById('student-course').value;
            alert("Student Profile Updated Successfully!\nStudent ID: " + studentId + "\nCourse: " + course);
        }

        function cancelEdit() {
            alert("Edit cancelled.");
        }

        function switchView() {
            alert("Switching to Parent View...");
        }
    </script>
</body>
</html>
